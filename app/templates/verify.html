<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telegram 加群验证</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+SC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <style>
:root{
  color-scheme: light dark;
  --paper:#f4f5f3; --surface:#ffffff; --surface-2:#fafbf9;
  --ink:#15181a; --ink-2:#4c5459; --ink-3:#67716c;
  --rule:#e0e3e0; --rule-2:#c8cdc9;
  --accent:#0e5c4f; --accent-soft:#e2efeb;
  --pass:#14664f; --warn:#8a5a0b; --danger:#a3291f;
  --pass-bg:#e6f1ec; --warn-bg:#f7efdf; --danger-bg:#f7e9e7;
  --sans:"IBM Plex Sans SC","IBM Plex Sans",-apple-system,"PingFang SC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --z-sticky:20; --z-header:30; --z-modal:60; --z-toast:80;
  --r:5px; --r-lg:8px; --tap:44px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#101312; --surface:#171b1a; --surface-2:#1c2120;
    --ink:#e7eae8; --ink-2:#a3aca8; --ink-3:#8a9491;
    --rule:#272d2b; --rule-2:#38403d;
    --accent:#5fc0aa; --accent-soft:#16302a;
    --pass:#5fc0aa; --warn:#d9a248; --danger:#e0776b;
    --pass-bg:#16302a; --warn-bg:#332a15; --danger-bg:#331e1b;
  }
}

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-width: 0;
        font-family: var(--sans);
        color: var(--ink);
        background: var(--paper);
        font-size: 14px;
        line-height: 1.55;
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      }

      .ledger {
        position: relative;
        width: min(480px, 100%);
        min-width: 0;
        overflow-wrap: anywhere;
        background: var(--surface);
        border: 1px solid var(--rule);
        border-top-color: var(--rule-2);
        border-radius: var(--r);
      }

      .ledger::before {
        content: "";
        position: absolute;
        top: 18px;
        bottom: 18px;
        left: -1px;
        width: 2px;
        background: var(--accent);
      }

      .ledger-header {
        display: grid;
        grid-template-columns: var(--tap) minmax(0, 1fr);
        gap: 14px;
        align-items: center;
        padding: 26px 30px 22px;
        border-bottom: 1px solid var(--rule);
      }

      .mark {
        width: var(--tap);
        height: var(--tap);
        display: grid;
        place-items: center;
        color: var(--accent);
        border: 1px solid var(--accent);
        border-radius: var(--r);
      }

      .mark svg {
        width: 24px;
        height: 24px;
      }

      .micro-label {
        margin: 0;
        color: var(--ink-3);
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: .13em;
        line-height: 1.4;
        text-transform: uppercase;
      }

      h1 {
        margin: 4px 0 0;
        font-size: 23px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -.02em;
      }

      .ledger-body {
        padding: 24px 30px 28px;
      }

      #message {
        margin: 0;
        color: var(--ink-2);
        font-size: 14px;
        line-height: 1.75;
        white-space: pre-wrap;
      }

      button {
        width: 100%;
        min-height: 48px;
        margin-top: 24px;
        padding: 12px 18px;
        color: var(--surface);
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: var(--r);
        cursor: pointer;
        font-family: var(--sans);
        font-size: 16px;
        font-weight: 600;
        line-height: 1.4;
        transition: background-color 160ms ease, color 160ms ease, transform 160ms ease;
      }

      button:hover:not(:disabled) {
        color: var(--accent);
        background: var(--accent-soft);
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: .58;
      }

      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      #status {
        display: grid;
        grid-template-columns: 20px minmax(0, 1fr);
        gap: 9px;
        align-items: start;
        min-height: var(--tap);
        margin-top: 18px;
        padding: 11px 13px;
        border: 1px solid var(--rule);
        border-left-width: 2px;
        border-radius: var(--r);
        font-size: 14px;
        font-weight: 500;
        line-height: 1.55;
      }

      #status:not(.st-busy):not(.st-ok):not(.st-err) {
        position: absolute;
        width: 1px;
        height: 1px;
        min-height: 0;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      .status-icon {
        display: none;
        width: 18px;
        height: 18px;
        margin-top: 1px;
      }

      .status-icon svg {
        display: block;
        width: 18px;
        height: 18px;
      }

      #status.st-busy {
        color: var(--warn);
        background: var(--warn-bg);
        border-left-color: var(--warn);
      }

      #status.st-ok {
        color: var(--pass);
        background: var(--pass-bg);
        border-left-color: var(--pass);
      }

      #status.st-err {
        color: var(--danger);
        background: var(--danger-bg);
        border-left-color: var(--danger);
      }

      #status.st-busy .icon-busy,
      #status.st-ok .icon-ok,
      #status.st-err .icon-err {
        display: block;
      }

      @media (max-width: 480px) {
        body {
          padding: max(16px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        }

        .ledger-header {
          gap: 12px;
          padding: 22px 20px 18px;
        }

        .ledger-body {
          padding: 20px 20px 24px;
        }

        h1 {
          font-size: 21px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: .01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="ledger">
      <header class="ledger-header">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <path d="m9 12 2 2 4-5"></path>
          </svg>
        </div>
        <div>
          <p class="micro-label">Verification Ledger · TG-GUARD</p>
          <h1>Telegram 加群验证</h1>
        </div>
      </header>
      <section class="ledger-body">
        <p id="message">{{ message }}</p>
      {% if show_button %}
        <button id="verify-btn" type="button" aria-describedby="message">完成验证</button>
      {% endif %}
        <div id="status" role="status" aria-live="polite" aria-atomic="true">
          <span class="status-icon icon-busy" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 7v5l3 2"></path>
            </svg>
          </span>
          <span class="status-icon icon-ok" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="m8 12 3 3 5-6"></path>
            </svg>
          </span>
          <span class="status-icon icon-err" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="m9 9 6 6M15 9l-6 6"></path>
            </svg>
          </span>
          <span id="status-text"></span>
        </div>
      </section>
    </main>

    <script>
      const verifyBtn = document.getElementById("verify-btn");
      const statusEl = document.getElementById("status");
      const statusTextEl = document.getElementById("status-text");
      const messageEl = document.getElementById("message");

      function updateStatus(text, state = "busy") {
        const classByState = {
          busy: "st-busy",
          ok: "st-ok",
          err: "st-err",
        };
        statusEl.classList.remove("st-busy", "st-ok", "st-err");
        statusEl.classList.add(classByState[state] || "st-busy");
        statusTextEl.textContent = text;
      }

      if (verifyBtn) {
        verifyBtn.addEventListener("click", async () => {
          verifyBtn.disabled = true;
          updateStatus("验证中，请稍候...");

          try {
            const response = await fetch(window.location.pathname, {
              method: "POST",
              headers: { "Accept": "application/json" },
            });

            const data = await response.json();

            if (data.status === "ok") {
              updateStatus("验证成功：请返回 Telegram 查看机器人的提示。", "ok");
              messageEl.textContent = "验证已完成，感谢配合。";
            } else if (data.status === "expired") {
              updateStatus("验证失败：链接已过期，请回到 Telegram 重新获取新的验证链接。", "err");
              messageEl.textContent = "链接已过期。";
            } else if (data.status === "already_verified") {
              updateStatus("已完成：该链接已经使用过了。", "ok");
              messageEl.textContent = "链接已完成验证。";
            } else if (data.status === "bot_error") {
              updateStatus(data.message || "机器人权限不足，请联系管理员处理。", "err");
            } else {
              updateStatus("验证失败：未知状态，请稍后重试或联系管理员。", "err");
            }
          } catch (error) {
            console.error(error);
            updateStatus("验证失败：请求失败，请稍后刷新页面再试。", "err");
            verifyBtn.disabled = false;
          }
        });
      }
    </script>
  </body>
</html>
